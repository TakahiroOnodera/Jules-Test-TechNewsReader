services:
  web:
    # Dockerfileがあるカレントディレクトリをビルドコンテキストとして使用
    build: .
    # コンテナのポート5000をホストのポート5000にマッピング
    ports:
      - "5000:5000"
    # ソースコードの変更をコンテナに即時反映させるためのボリュームマウント
    # ホストのカレントディレクトリをコンテナの/appにマウント
    volumes:
      - .:/app
    # 環境変数
    environment:
      # Flaskのデバッグモードを有効にする (新しい形式)
      - FLASK_DEBUG=1
      # ここに取得したNewsAPIのキーを設定
      - NEWS_API_KEY=37ea12f90efa480393cae46c48cd0475
