<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech News Reader</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- ヘッダーエリア -->
    <header class="site-header">
        <div class="header-content">
            <h1 class="site-title">Tech News</h1>
            <!-- 検索フォーム -->
            <form id="search-form" class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="search" id="search-box" placeholder="記事を検索..." autocomplete="off">
                <button type="button" id="clear-search-btn" class="clear-search-button hidden">&times;</button>
            </form>
            <!-- ダークモード切り替えボタン -->
            <button id="dark-mode-toggle" class="dark-mode-button">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- メインコンテンツエリア -->
    <main>
        <!-- ニュースカードがここに挿入される -->
        <div id="news-container" class="news-grid">
            <!-- ローディングメッセージがここに表示される -->
            <p id="loading-message">Loading news...</p>
        </div>
        <!-- 検索結果がない場合に表示するメッセージ -->
        <div id="no-results-message" class="no-results hidden">
            <p>No articles found matching your search.</p>
        </div>
    </main>

    <!-- JavaScriptファイルをページの最後に移動し、DOMの準備完了を保証 -->
    <script src="/static/js/script.js"></script>
</body>
</html>
